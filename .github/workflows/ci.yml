name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Test
      run: make test

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        install-mode: goinstall
        install-only: true

    - name: Lint
      run: make lint
